[package]
name = "karuturirs_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlButtonElement", "HtmlInputElement",
    "AudioContext", "AudioNode", "AudioDestinationNode", "OscillatorNode", "GainNode",
    "SpeechSynthesis", "SpeechSynthesisUtterance",
    "Storage", "Location", "History", "Performance", "console", "DomTokenList", "MouseEvent",
    "ScrollToOptions", "ScrollBehavior"
] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

